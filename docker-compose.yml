services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lakarra
      POSTGRES_PASSWORD: lakarra
      POSTGRES_DB: lakarra
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    environment:
      MEMORY_BACKEND: in_memory
      DATABASE_URL: postgresql+psycopg2://lakarra:lakarra@db:5432/lakarra
      REDIS_URL: redis://redis:6379/0
      LLM_PROVIDER: mock
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    volumes:
      - ./backend:/app

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app

volumes:
  db_data:
