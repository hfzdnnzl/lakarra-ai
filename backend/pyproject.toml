[project]
name = "lakarra-ai-backend"
version = "0.1.0"
description = "Multi-agent AI operating system for the Lakarra business (backend)."
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI uses function calls (Depends) in argument defaults.
# UP042: `str`+`Enum` mixin is intentional for JSON-friendly Pydantic serialization.
ignore = ["B008", "UP042"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
